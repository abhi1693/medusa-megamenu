name: Publish to npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag. Run recovery from master.
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    uses: abhi1693/actions/.github/workflows/npm-publish.yml@6c9bbfa21084e95f1c2837e35d553179c8f47b4c
    permissions:
      contents: read
      attestations: read
      id-token: write
    with:
      package-name: '@abhi1693/medusa-megamenu'
      tag: ${{ github.event.release.tag_name || inputs.tag }}
