name: Plugin checks
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - name: Load shared package verifier
        id: release-tools
        uses: abhi1693/actions/.github/actions/npm-release@02c926a5d737bb3abca05788c5cea8a2b0b8767b # v1.1.1
      - name: Verify actual distributable
        env:
          TOOLS: ${{ steps.release-tools.outputs.path }}
          PACKAGE_NAME: '@abhi1693/medusa-megamenu'
        run: node "$TOOLS/package.mjs" --check-only
