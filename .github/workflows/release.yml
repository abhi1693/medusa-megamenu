name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package version to prepare as a draft.
        type: string
        required: true
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    uses: abhi1693/actions/.github/workflows/npm-release.yml@062b31c1f58654d1793dce62907a2f41ea792ba3
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      operation: prepare
      package-name: '@abhi1693/medusa-megamenu'
      version: ${{ inputs.version }}
